name: dosya_converter
description: Offline dosya dönüştürücü (PDF, DOCX, XLSX, PPTX, JPG/PNG, ZIP) + Google Drive senkronizasyonu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # PDF oluşturma
  pdf: ^3.11.1
  printing: ^5.13.4

  # Dosya seçme / depolama / paylaşma
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  share_plus: ^10.1.2

  # ZIP ayıklama
  archive: ^3.6.1

  # XLSX okuma
  excel: ^4.0.6

  # DOCX / PPTX içindeki XML'i parse etmek için (docx ve pptx de birer zip'tir)
  xml: ^6.5.0

  # Google Sign-In + Drive senkron
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  http: ^1.2.2

  # State management (basit)
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true